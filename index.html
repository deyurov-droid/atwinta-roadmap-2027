<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Дорожная карта стратегии: 2026–2027</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  color-scheme:light;
  --bg:#F2F3F5;--surface:#FFF;--sub:#F7F8FA;--fg:#1B1D21;--text:#4A4E55;--muted:#646B75;--edge:#E1E4E9;--input:#A0A6B0;
  --accent:#FF2159;--pink:#FFE8EE;--red:#B00036;--amber:#FFF0D4;--brown:#754500;--slate:#E9EDF4;--slate-text:#42516C;--green:#E1F3E9;--green-text:#206244;
  --gut:clamp(14px,3vw,42px);--pad:clamp(14px,1.65vw,24px);--gap:clamp(14px,1.7vw,24px);
}
[data-theme="dark"] {
  color-scheme:dark;
  --bg:#141518;--surface:#1C1E23;--sub:#252830;--fg:#F2F3F5;--text:#D2D6DD;--muted:#B3BBC7;--edge:#3C424E;--input:#777F8D;
  --pink:#482431;--red:#FFABC0;--amber:#40321F;--brown:#F9CE88;--slate:#2D3748;--slate-text:#CAD7EC;--green:#213C31;--green-text:#A7E2BF;
}
*,*::before,*::after {box-sizing:border-box}
[hidden] {display:none!important}
body {margin:0;background:var(--bg);color:var(--fg);font:400 .875rem/1.5 Geologica,system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p,ol,ul,figure {margin:0}
h1,h2,h3,h4 {line-height:1.25;font-weight:600;letter-spacing:-.025em}
h1 {font-size:clamp(1.42rem,2.35vw,2.2rem)}
h2 {font-size:clamp(1.05rem,1.55vw,1.36rem)}
h3 {font-size:clamp(1.1rem,1.65vw,1.45rem)}
h4 {font-size:.95rem}
button,select,input {font:inherit}
button,select {cursor:pointer}
:focus-visible {outline:2px solid var(--red);outline-offset:2px}
.shell {max-width:1560px;margin-inline:auto;padding-inline:var(--gut);min-width:0}
.skip {position:fixed;left:12px;top:8px;transform:translateY(-180%);z-index:10;background:var(--surface);color:var(--fg);padding:8px 12px}
.skip:focus {transform:none}
.top {background:#0E0E0E;color:white}
.top .shell {display:flex;align-items:center;justify-content:space-between;gap:16px 28px;min-height:124px;padding-block:18px}
.top-side {display:grid;justify-items:end;gap:8px;flex:none}
.meta {margin-top:8px;color:#CCC;line-height:1.55;font-size:.8rem}
.stats,.actions,.project-meta,.decision-grid,.filter-set,.local {display:flex;align-items:center;gap:8px}
.stats,.actions {flex-wrap:wrap}
.stat,.button,select,.filter {border-radius:6px;white-space:nowrap;font-size:.775rem;color:inherit}
.stat {border:1px solid #3C3C3C;padding:4px 8px}
.stat-hot {color:#FFA8BE}
.button,select,.filter {background:var(--surface);border:1px solid var(--input);padding:5px 10px;min-height:32px}
.button:hover,.filter:hover,select:hover {background:var(--sub)}
.top .button {background:#202020;border-color:#545454;color:white}
.top .button:hover {background:#343434}
.top :focus-visible {outline-color:#FFA8BE}
main {display:grid;gap:var(--gap);padding-block:var(--gap) 26px}
main>* {min-width:0}
.panel,.card,.more-details {background:var(--surface);border:1px solid var(--edge);border-radius:12px;min-width:0}
.section-head {display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:5px 14px;margin-bottom:11px}
.section-head p,.section-head output {color:var(--muted);font-size:.8125rem}
.decisions {padding:14px var(--pad)}
.decision-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.decision {background:var(--sub);border:1px solid var(--edge);border-radius:7px;min-width:0}
.decision-line {display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding-inline:4px 7px;gap:6px;min-height:47px}
.decision-toggle {display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;min-height:42px;width:100%;text-align:start;background:none;color:var(--fg);border:0;border-radius:4px;padding:5px 5px;font-size:.8125rem;font-weight:500;line-height:1.25}
.decision-toggle:hover,.more-details summary:hover {color:var(--red)}
.num {display:grid;place-items:center;width:24px;height:24px;background:var(--pink);color:var(--red);border-radius:5px;font-size:.75rem;font-weight:600}
.chevron {display:inline-block;width:8px;height:8px;border-inline-end:1.5px solid currentColor;border-block-end:1.5px solid currentColor;transform:rotate(45deg);margin:0 3px 4px 2px;flex:none}
[aria-expanded="true"] .chevron,details[open]>summary .chevron {transform:rotate(225deg);margin-block:4px 0}
select {max-width:100%;padding-inline:6px;font-size:.75rem}
select[data-status="working"] {background:var(--amber);color:var(--brown)}
select[data-status="done"] {background:var(--green);color:var(--green-text)}
.decision-body {border-top:1px solid var(--edge);padding:11px;display:grid;gap:7px;color:var(--text);font-size:.8125rem}
.decision-body strong,.have strong,.milestone-fallback strong,.risk strong {color:var(--fg);font-weight:600}
.print-status {display:none}
.timeline-head {padding:14px var(--pad) 0;margin:0}
.timeline-scroll {overflow-x:auto;max-width:100%;scrollbar-width:thin}
.timeline-scroll:focus-visible {outline-offset:-3px}
.chart {--labels:242px;--today:0%;--marker-fade:color-mix(in srgb,var(--accent) 50%,transparent);min-width:1130px;padding-inline:var(--pad);isolation:isolate}
.chart-row {display:grid;grid-template-columns:var(--labels) minmax(0,1fr);position:relative;min-width:0}
.chart-row:not(.chart-head) {cursor:pointer;border-bottom:1px solid var(--edge);min-height:62px}
.chart-row:not(.chart-head):hover,.chart-row.selected {background:var(--sub)}
.chart-row.selected .stream {box-shadow:inset 3px 0 var(--accent)}
.stream {position:sticky;left:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:start;width:100%;gap:4px;padding:4px 11px 4px 12px;border:0;border-radius:0;text-align:start;background:var(--surface);color:var(--fg);line-height:1.25}
.chart-row:hover .stream,.chart-row.selected .stream {background:var(--sub)}
.stream:focus-visible {outline-offset:-3px}
.stream-name {font-size:.8125rem;font-weight:600;overflow-wrap:anywhere}
.project-meta {gap:7px;flex-wrap:wrap}
.row-count,.stream-label {color:var(--muted);font-size:.75rem}
.badge {display:inline-block;padding:2px 7px;border-radius:4px;white-space:nowrap;background:var(--sub);color:var(--muted);font-size:.72rem;line-height:1.4;font-weight:500}
.badge.urgent {background:var(--pink);color:var(--red);box-shadow:inset 2px 0 var(--accent)}
.badge.active {background:var(--amber);color:var(--brown)}
.track {position:relative;min-width:0;border-inline-end:1px solid var(--edge)}
.chart-head .track {padding-top:37px}
.chart-head .stream {justify-content:end;padding-bottom:6px}
.months {display:grid;grid-template-columns:var(--months);position:relative;min-height:26px;border-bottom:1px solid var(--edge)}
.month {min-width:0;border-inline-start:1px solid var(--edge);white-space:nowrap;padding:3px 0 5px 6px;color:var(--muted);font-size:.75rem;line-height:1.35}
.month.year {font-weight:600;color:var(--fg)}
.lines {position:absolute;inset:0;pointer-events:none;z-index:0}
.lines i {position:absolute;inset-block:0;left:var(--at);border-inline-start:1px solid var(--edge)}
.today-line {position:absolute;inset-block:0;left:var(--today);width:2px;background:var(--marker-fade);z-index:1;pointer-events:none}
.today {position:absolute;left:clamp(0px,calc(var(--today) - 48px),calc(100% - 102px));top:3px;z-index:2;display:flex;align-items:center;gap:5px;min-height:21px;padding:2px 6px;border-radius:4px;background:var(--pink);color:var(--red);font-weight:600;font-size:.72rem;line-height:1.2;white-space:nowrap}
.today::before {content:"";width:5px;height:5px;background:var(--accent);border-radius:50%}
.bar {position:absolute;z-index:2;display:flex;align-items:center;left:var(--start);width:var(--duration);top:5px;min-height:31px;padding:3px 6px;box-shadow:inset -1px 0 var(--surface);border-radius:4px;background:var(--slate);color:var(--slate-text);font-size:.7375rem;font-weight:500;line-height:1.12;overflow-wrap:anywhere}
.bar.hot {background:var(--accent);color:#220711}
.bar.soft {background:var(--pink);color:var(--red)}
.marker {position:absolute;bottom:0;left:var(--at);transform:translateX(-50%);z-index:3;width:29px;height:28px;border:0;padding:0;background:transparent;color:var(--slate-text);border-radius:5px}
.marker::after,.diamond {content:"";display:block;width:9px;height:9px;margin:auto;border:2px solid currentColor;background:var(--surface);border-radius:1px;transform:rotate(45deg)}
.marker:hover,.marker[aria-pressed="true"],.marker:focus-visible {color:var(--red)}
.marker:hover::after,.marker[aria-pressed="true"]::after {background:var(--pink)}
.marker:focus-visible {outline-offset:-3px}
.timeline-info {display:flex;align-items:center;gap:10px;min-height:43px;padding:7px var(--pad);font-size:.78rem;color:var(--muted);background:var(--sub);border-radius:0 0 11px 11px}
.diamond {flex:none;margin:0 2px;color:var(--slate-text)}
.timeline-info strong {color:var(--fg);font-weight:600}
.scroll-hint {display:none}
.filters {display:grid;gap:7px;margin-bottom:10px}
.filter-set {flex-wrap:wrap;min-width:0;gap:6px}
.filter {background:transparent;border-color:var(--edge);color:var(--text)}
.filter[aria-pressed="true"] {background:var(--pink);border-color:var(--red);color:var(--red);font-weight:500}
#chips .filter {font-size:.75rem;min-height:29px;background:var(--surface)}
#chips .filter[aria-pressed="true"] {background:var(--pink)}
#cards {display:grid;gap:12px}
.card {padding:var(--pad)}
.project-head {display:flex;gap:10px 24px;align-items:start;justify-content:space-between;margin-bottom:8px}
.project-title {display:flex;align-items:center;gap:6px 9px;flex-wrap:wrap}
.progress {display:grid;gap:4px;color:var(--muted);font-size:.75rem;min-width:min(186px,100%)}
progress {appearance:none;width:100%;height:5px;border:0;border-radius:5px;background:var(--edge);accent-color:var(--accent)}
progress::-webkit-progress-bar {background:var(--edge);border-radius:5px}
progress::-webkit-progress-value {background:var(--accent);border-radius:5px}
progress::-moz-progress-bar {background:var(--accent);border-radius:5px}
.summary {max-width:90ch;color:var(--text)}
.have {margin-top:9px;padding:8px 11px;background:var(--sub);color:var(--text);border-radius:6px;font-size:.8125rem}
.project-columns {display:grid;grid-template-columns:minmax(0,1.64fr) minmax(0,1fr);column-gap:var(--pad);margin-top:14px}
.project-columns>div+div {border-inline-start:1px solid var(--edge);padding-inline-start:var(--pad)}
.task-list,.milestone-list {list-style:none;padding:0;margin-top:5px}
.task-list li+li,.milestone-list li+li {border-top:1px solid var(--edge)}
.task {display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:9px;padding:9px 0;cursor:pointer}
.task input {width:17px;height:17px;margin:2px 0 0;accent-color:var(--red);cursor:pointer}
.task input:checked+.task-text {color:var(--muted);text-decoration:line-through}
.task-text {color:var(--text);overflow-wrap:anywhere;font-size:.8125rem}
.due {align-self:start;font-weight:400}
.milestone-list li {padding:8px 0;font-size:.8125rem;break-inside:avoid}
.milestone-list time {color:var(--red);font-weight:600}
.milestone-text {margin-top:3px}
.milestone-fallback {margin-top:3px;color:var(--muted);font-size:.75rem}
.local {flex-wrap:wrap;margin-top:11px;padding:8px var(--pad);background:var(--sub);border:1px solid var(--edge);border-radius:8px;color:var(--text);font-size:.8rem}
.local>p:first-child {margin-inline-end:auto}
.copy-feedback:not(:empty) {color:var(--green-text)}
.more-details summary {display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none;cursor:pointer;font-weight:500;padding:12px var(--pad);border-radius:10px}
.more-details summary::-webkit-details-marker {display:none}
.more-body {border-top:1px solid var(--edge);padding:12px var(--pad) var(--pad);display:grid;gap:16px}
.risk-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.risk {padding:10px;background:var(--sub);border-radius:6px;break-inside:avoid}
.risk p,.questions {color:var(--text);font-size:.8125rem}
.risk p {margin-top:5px}
.questions {margin-top:6px;padding-inline-start:1.35em}
.questions li+li {margin-top:4px}
footer {border-top:1px solid var(--edge);padding-block:12px 16px;color:var(--muted);font-size:.75rem}
footer .shell {display:flex;flex-wrap:wrap;justify-content:space-between;gap:5px 12px}
@media(max-width:1180px) {
  .gantt-hint {display:block!important}
  .chart {--labels:228px}
}
@media(max-width:880px) {
  .top .shell {align-items:start;flex-direction:column}
  .top-side {justify-items:start}
  .decision-grid {grid-template-columns:minmax(0,1fr)}
}
@media(max-width:760px) {
  .chart {--labels:153px;min-width:1050px}
  .stream {padding-inline:7px}
  .project-columns {grid-template-columns:minmax(0,1fr);row-gap:13px}
  .project-columns>div+div {padding:12px 0 0;border-inline-start:0;border-top:1px solid var(--edge)}
  .filter-hint {display:block!important}
  .filter-set {overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin;padding:3px;margin:-3px}
  .filter {flex:none;min-height:44px}
  #chips .filter {min-height:38px}
}
@media(max-width:640px) {
  #print-button {display:none}
  .top .button,.local .button {min-height:44px}
  .project-head {flex-direction:column}
  .progress {width:min(245px,100%)}
  .risk-grid {grid-template-columns:minmax(0,1fr)}
  .task {min-height:44px}
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
@page {size:A4 landscape;margin:11mm}
@media print {
  :root,[data-theme="dark"] {color-scheme:light;--bg:white;--surface:white;--sub:#F7F8FA;--fg:#1B1D21;--text:#35383E;--muted:#545B65;--edge:#DFE2E7;--pink:#FFE8EE;--red:#B00036;--amber:#FFF0D4;--brown:#754500;--slate:#E9EDF4;--slate-text:#42516C}
  body {font-size:9pt;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .shell {width:100%;padding-inline:0}
  .top {background:white;color:var(--fg)}
  .top .shell {padding-block:0 7px;min-height:0;flex-direction:row;align-items:center}
  .top .meta,.stat-hot {color:var(--fg)}
  .stat {border-color:var(--edge)}
  h1 {font-size:19pt}h2 {font-size:14pt}h3 {font-size:12pt}
  main {gap:10px;padding-block:8px}
  .actions,.filters,.local,.skip,.scroll-hint,.timeline-info,.decision-line select,.decision-toggle .chevron,.timeline-head p,.more-details summary .chevron {display:none!important}
  .decision-grid,.risk-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
  .decision {break-inside:avoid}
  .decision-line {min-height:32px}
  .decision-toggle {min-height:0;padding:0;font-size:9pt}
  .decision-body[hidden] {display:grid!important}
  .decision-body {font-size:8pt;padding:6px}
  .print-status {display:block;font-size:8pt;color:var(--muted);margin-right:3px}
  .timeline-scroll {overflow:visible}
  .chart {min-width:0;--labels:155px;padding-inline:10px}
  .chart-row:not(.chart-head) {min-height:48px}
  .stream-name,.month,.bar {font-size:8pt}
  .bar {min-height:27px;padding:2px 4px}
  .marker {height:17px}
  .marker::after {width:7px;height:7px}
  .timeline,.project-head,.task-list li {break-inside:avoid}
  #cards .card[hidden] {display:block!important}
  #cards .card {break-inside:avoid;padding:10px}
  .project-columns {grid-template-columns:minmax(0,1.64fr) minmax(0,1fr)}
  .project-columns>div+div {padding:0 0 0 12px;border-top:0;border-inline-start:1px solid var(--edge)}
  .task {min-height:0;padding:4px 0}
  .more-details::details-content {content-visibility:visible}
  footer {padding-block:7px}
}
</style>
</head>

  <div class="shell">
    <div><h1 id="title">Дорожная карта стратегии: 2026–2027</h1><p class="meta" id="meta"></p></div>

    <div id="cards"></div>

  </section>
  <details class="more-details" id="more">

  $('footer-date').dateTime = meta.updatedAt;

  const chevron = '<i class="chevron" aria-hidden="true"></i>';
  const badge = p => `<span class="badge ${escape(p.priority)}">${escape(p.priorityLabel)}</span>`;
  $('decisions').innerHTML = decisions.map(d => `<article class="decision">
    <div class="decision-line"><h3><button type="button" class="decision-toggle" aria-expanded="false" aria-controls="decision-${escape(d.id)}"><span class="num">${escape(d.num)}</span><span>${escape(d.title)}</span>${chevron}</button></h3>
    <select data-decision="${escape(d.id)}" aria-label="Статус решения ${escape(d.num)}: ${escape(d.title)}">${Object.entries(status).map(([value,label]) => `<option value="${value}">${label}</option>`).join('')}</select><span class="print-status"></span></div>
    <div class="decision-body" id="decision-${escape(d.id)}" hidden><p><strong>Сейчас:</strong> ${escape(d.now)}</p><p><strong>Предложение:</strong> ${escape(d.proposal)}</p></div>
  </article>`).join('');
  for (const button of list('.decision-toggle')) button.addEventListener('click',() => {
    const open = button.getAttribute('aria-expanded') === 'true';
    button.setAttribute('aria-expanded',String(!open));
    $(button.getAttribute('aria-controls')).hidden = open;
  });
  for (const select of list('select[data-decision]')) select.addEventListener('change',() => {
    const d = decisionMap.get(select.dataset.decision);
    if (!Object.hasOwn(status,select.value)) return;
    setDelta(delta.decisions,d.id,select.value,d.status);
    save(); updateCounts();
  });

  const first = dateMs(meta.rangeStart);
  const afterLast = dateMs(meta.rangeEnd)+dayMs;
  const percentage = time => 100*Math.min(1,Math.max(0,(time-first)/(afterLast-first)));
  const marks = [];
  for (let from = first; from < afterLast;) {
    const d = new Date(from);
    const next = Math.min(afterLast,Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));
    marks.push({from,days:(next-from)/dayMs,text:`${monthsShort[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(-2)}`,year:d.getUTCMonth()===0 || from===first});
    from = next;
  }
  const lines = `<div class="lines" aria-hidden="true">${marks.map(m => `<i style="--at:${percentage(m.from)}%"></i>`).join('')}</div><i class="today-line" aria-hidden="true" hidden></i>`;
  $('chart').innerHTML = `<div class="chart-row chart-head"><div class="stream"><span class="stream-label">Проект / задачи</span></div><div class="track"><i class="today-line" aria-hidden="true" hidden></i><time class="today" hidden></time><div class="months" aria-label="Месяцы" style="--months:${marks.map(m => `minmax(0,${m.days}fr)`).join(' ')}">${marks.map(m => `<span class="month${m.year?' year':''}">${m.text}</span>`).join('')}</div></div></div>` +
    projects.map(p => `<div class="chart-row" data-row="${escape(p.id)}"><button class="stream" type="button" aria-pressed="false" aria-controls="cards"><span class="stream-name">${escape(p.name)}</span><span class="project-meta">${badge(p)} <span class="row-count"></span></span></button><div class="track">${lines}${p.bars.map(b => {
      const start = percentage(dateMs(b.start));
      const duration = percentage(dateMs(b.end)+dayMs)-start;
      return `<span class="bar ${escape(b.tone)}" style="--start:${start}%;--duration:${duration}%" title="${escape(b.label)} · ${shortDate(b.start)} – ${shortDate(b.end)}">${escape(b.label)}</span>`;
    }).join('')}${p.milestones.map((m,i) => `<button class="marker" type="button" aria-pressed="false" aria-controls="timeline-info" aria-label="${shortDate(m.date)} · ${escape(p.name)}: ${escape(m.label)}" data-marker="${i}" style="--at:${percentage(dateMs(m.date)+dayMs/2)}%"></button>`).join('')}</div></div>`).join('');
  let pinned = null;
  let hovered = null;
  const markerInfo = () => {
    const marker = hovered || (document.activeElement?.matches('.marker') ? document.activeElement : null) || pinned;
    const icon = '<i class="diamond" aria-hidden="true"></i>';
    if (!marker) {
      $('timeline-info').innerHTML = `${icon}<span>Наведи на ромб или выбери его, чтобы увидеть контрольную точку.</span>`;
      return;
    }
    const p = projectMap.get(marker.closest('[data-row]').dataset.row);
    const m = p.milestones[Number(marker.dataset.marker)];
    $('timeline-info').innerHTML = `${icon}<span><strong>${shortDate(m.date)} · ${escape(p.name)}</strong> — ${escape(m.label)}. <strong>Если нет:</strong> ${escape(m.fallback)}</span>`;
  };
  const pin = marker => {
    pinned?.setAttribute('aria-pressed','false');
    pinned = marker;
    pinned?.setAttribute('aria-pressed','true');
  };
  const choose = id => { selected = id; mode = 'selected'; showView(); };
  for (const row of list('[data-row]')) row.addEventListener('click',() => choose(row.dataset.row));
  for (const marker of list('.marker')) {
    marker.addEventListener('pointerenter',() => { hovered = marker; markerInfo(); });
    marker.addEventListener('pointerleave',() => { hovered = null; markerInfo(); });
    marker.addEventListener('focus',markerInfo);
    marker.addEventListener('blur',() => queueMicrotask(markerInfo));
    marker.addEventListener('click',event => { event.stopPropagation(); choose(marker.closest('[data-row]').dataset.row); pin(pinned === marker ? null : marker); markerInfo(); });
    marker.addEventListener('keydown',event => {
      if (event.key === 'Escape') { pin(null); hovered = null; marker.closest('[data-row]').querySelector('.stream').focus(); }
    });
  }
  markerInfo();

  const shortNames = {crm:'CRM',hermes:'Hermes',margin:'Маржинальность',learning:'Обучение',harness:'Харнесс',other:'Разработка и отделы'};
  const filters = {selected:'Выбранный проект',urgent:`Только срочные (${urgent.length})`,all:`Все проекты (${projects.length})`};
  $('modes').innerHTML = Object.entries(filters).map(([id,label]) => `<button type="button" class="filter" data-mode="${id}" aria-controls="cards" aria-pressed="false">${label}</button>`).join('');
  $('chips').innerHTML = projects.map(p => `<button type="button" class="filter" data-chip="${escape(p.id)}" aria-label="${escape(p.name)}" aria-controls="cards" aria-pressed="false">${escape(shortNames[p.id] || p.name)}</button>`).join('');
  for (const button of list('[data-mode]')) button.addEventListener('click',() => { mode = button.dataset.mode; showView(); });
  for (const button of list('[data-chip]')) button.addEventListener('click',() => choose(button.dataset.chip));
  $('cards').innerHTML = projects.map(p => `<article class="card" data-card="${escape(p.id)}" aria-labelledby="project-${escape(p.id)}">
    <div class="project-head"><div class="project-title"><h3 id="project-${escape(p.id)}">${escape(p.name)}</h3>${badge(p)}</div>
    <div class="progress"><span class="progress-text"></span><progress max="${p.tasks.length || 1}" value="0" aria-label="Выполнено задач"></progress></div></div>
    <p class="summary">${escape(p.summary)}</p><p class="have"><strong>Уже есть:</strong> ${escape(p.have)}</p>
    <div class="project-columns"><div><h4>Задачи проекта</h4><ul class="task-list">${p.tasks.map(t => `<li><label class="task"><input type="checkbox" data-task="${escape(t.id)}"><span class="task-text">${escape(t.text)}</span><span class="badge due">${escape(t.due)}</span></label></li>`).join('')}</ul></div>
    <div><h4>Контрольные точки</h4><ul class="milestone-list">${p.milestones.map(m => `<li><time datetime="${escape(m.date)}">${shortDate(m.date)}</time> <span class="badge past" data-past="${escape(m.date)}" hidden>Срок прошёл</span><p class="milestone-text">${escape(m.label)}</p><p class="milestone-fallback"><strong>Если нет:</strong> ${escape(m.fallback)}</p></li>`).join('')}</ul></div></div>
  </article>`).join('');
  for (const input of list('[data-task]')) input.addEventListener('change',() => {
    const task = taskMap.get(input.dataset.task);
    setDelta(delta.tasks,task.id,input.checked,task.done);
    save(); updateCounts();
  });
  function showView() {
    for (const row of list('[data-row]')) {
      const active = row.dataset.row === selected;
      row.classList.toggle('selected',active);
      row.querySelector('.stream').setAttribute('aria-pressed',String(active));
    }
    for (const button of list('[data-mode]')) button.setAttribute('aria-pressed',String(button.dataset.mode === mode));
    for (const button of list('[data-chip]')) button.setAttribute('aria-pressed',String(mode === 'selected' && button.dataset.chip === selected));
    for (const card of list('[data-card]')) card.hidden = !(mode === 'all' || (mode === 'urgent' ? projectMap.get(card.dataset.card).priority === 'urgent' : card.dataset.card === selected));
  }
  function updateCounts() {
    const resolved = decisions.filter(d => decisionStatus(d) === 'done').length;
    $('top-decisions').textContent = `Решений: ${resolved}/${decisions.length}`;
    $('decisions-count').textContent = `Решено ${resolved} из ${decisions.length}`;
    $('top-tasks').textContent = `Задач: ${tasks.filter(taskDone).length}/${tasks.length}`;
    for (const select of list('select[data-decision]')) {
      const value = decisionStatus(decisionMap.get(select.dataset.decision));
      select.value = select.dataset.status = value;
      select.nextElementSibling.textContent = status[value];
    }
    for (const row of list('[data-row]')) {
      const p = projectMap.get(row.dataset.row);
      row.querySelector('.row-count').textContent = `${totalDone(p)}/${p.tasks.length}`;
    }
    for (const card of list('[data-card]')) {
      const p = projectMap.get(card.dataset.card);
      const count = totalDone(p);
      card.querySelector('.progress-text').textContent = `Выполнено ${count} из ${p.tasks.length} задач`;
      card.querySelector('progress').value = count;
    }
    for (const box of list('[data-task]')) box.checked = taskDone(taskMap.get(box.dataset.task));
    $('local').hidden = !delta.decisions.size && !delta.tasks.size;
    $('copy-feedback').textContent = '';
  }
  showView(); updateCounts();
  $('reset').addEventListener('click',() => {
    delta.decisions.clear(); delta.tasks.clear(); save(); updateCounts();
    list('[data-mode]').find(button => button.dataset.mode === mode)?.focus();
  });
  $('copy').addEventListener('click',async () => {
    const text = [
      ...decisions.filter(d => delta.decisions.has(d.id)).map(d => `Решение ${d.num}. ${d.title}: ${status[decisionStatus(d)]}`),
      ...projects.flatMap(p => p.tasks.filter(t => delta.tasks.has(t.id)).map(t => `${p.name}: ${t.text} — ${taskDone(t)?'выполнено':'не выполнено'}`))
    ].join('\n');
    try { await navigator.clipboard.writeText(text); }
    catch {
      const field = document.createElement('textarea');
      field.value = text;
      field.style.cssText = 'position:fixed;inset:0 auto auto 0;opacity:0;pointer-events:none';
      document.body.append(field);
      field.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch { /* Буфер недоступен. */ }
      field.remove(); $('copy').focus();
      if (!copied) { $('copy-feedback').textContent = 'Не удалось скопировать'; return; }
    }
    $('copy-feedback').textContent = 'Скопировано';
  });
  $('more-title').textContent = `Риски (${risks.length}) и открытые вопросы (${openQuestions.length})`;
  $('more-body').innerHTML = `<section><h4>Риски</h4><div class="risk-grid">${risks.map(r => `<article class="risk"><h4>${escape(r.title)}</h4><p><strong>Сигнал:</strong> ${escape(r.signal)}</p><p><strong>Что делаем:</strong> ${escape(r.action)}</p></article>`).join('')}</div></section><section><h4>Открытые вопросы</h4><ul class="questions">${openQuestions.map(q => `<li>${escape(q)}</li>`).join('')}</ul></section>`;
  let detailsBeforePrint;
  window.addEventListener('beforeprint',() => { detailsBeforePrint ??= $('more').open; $('more').open = true; });
  window.addEventListener('afterprint',() => { if (detailsBeforePrint !== undefined) $('more').open = detailsBeforePrint; detailsBeforePrint = undefined; });
  function showToday() {
    const now = new Date();
    const date = todayISO(now);
    const within = date >= meta.rangeStart && date <= meta.rangeEnd;
    $('chart').style.setProperty('--today',`${percentage(dateMs(date)+dayMs/2)}%`);
    for (const node of list('.today-line, .today')) node.hidden = !within;
    const label = document.querySelector('.today');
    label.dateTime = date;
    label.textContent = `Сегодня, ${String(now.getDate()).padStart(2,'0')} ${monthsShort[now.getMonth()]}`;
    for (const badge of list('[data-past]')) badge.hidden = badge.dataset.past >= date;
  }
  showToday();
  document.addEventListener('visibilitychange',() => { if (!document.hidden) showToday(); });
})();
</script>
</body>
</html>
